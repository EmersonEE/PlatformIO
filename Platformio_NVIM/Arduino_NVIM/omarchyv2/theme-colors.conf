# Colores manuales por tema para los LEDs WS2812
# Formatos soportados:
#   nombre_del_tema=RRGGBB          (usa el brillo por defecto)
#   nombre_del_tema=RRGGBB,brillo   (brillo opcional de 0 a 255)
#
# Ejemplos:
#   lumon=00ffff,180
#   tokyo_night=1e66f5,220
#   gruvbox=d8a657
#
# El nombre_del_tema debe coincidir EXACTO con el contenido de:
#   ~/.local/state/omarchy/current/theme.name
#
# Lineas que empiecen con # son comentarios y se ignoran.
# Si un tema no aparece aqui, el hook usara keyboard.rgb o colors.toml como respaldo.

lumon=00ffff,180
