; =========================================================================
; PlatformIO Project Configuration File - Sistema de Mision Critica Data Center
; Board: Arduino Uno R3 (ATmega328P) | Framework: Arduino
; =========================================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_filters = send_on_enter, time
build_flags = 
    -Wall
    -O2

; Librerias oficiales gestionadas automaticamente por PlatformIO
; NOTA: U8g2 en modo pagina ("_1_") usa 128 B de buffer para la OLED,
; frente a los 1024 B que exige el framebuffer de Adafruit_SSD1306.
; En un ATmega328P (2 KB de SRAM) con Keypad+Servo+ArduinoJson, el de
; 1024 B no cabe y begin() fallaba por malloc() denegado.
lib_deps =
    olikraus/U8g2 @ ^2.36.5
    chris--a/Keypad @ ^3.1.1
    arduino-libraries/Servo @ ^1.2.2
    bblanchon/ArduinoJson @ ^6.21.4
